name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        type: choice
        required: true
        default: both
        options:
          - both
          - debug
          - release
      publish_release:
        description: '构建后创建 GitHub Release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [master]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 项目默认走阿里云镜像，在 GitHub Actions 里会 502；设为 false 走 Google/Maven Central 官方源
    env:
      YUNX_USE_MIRROR: "false"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 platform 与 build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 授权 gradlew
        run: chmod +x ./gradlew

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 构建 Debug APK
        if: github.event.inputs.build_type != 'release'
        run: ./gradlew assembleDebug --stacktrace

      - name: 构建 Release APK
        if: github.event.inputs.build_type != 'debug'
        run: ./gradlew assembleRelease --stacktrace

      - name: 对齐并签名 Release APK
        if: github.event.inputs.build_type != 'debug'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          ZIPALIGN="${BT}zipalign"
          APKSIGNER="${BT}apksigner"
          UNSIGNED=$(find app/build/outputs/apk/release -name '*unsigned*.apk' | head -1)
          [ -z "$UNSIGNED" ] && UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/sign.jks
            KS=/tmp/sign.jks
            KSP="$KEYSTORE_PASSWORD"
            KA="$KEY_ALIAS"
            KP="$KEY_PASSWORD"
          else
            echo "未检测到签名密钥 Secrets，回退使用仓库自带的 debug.keystore"
            KS=debug.keystore
            KSP=android
            KA=androiddebugkey
            KP=android
          fi
          "$ZIPALIGN" -p -f 4 "$UNSIGNED" /tmp/aligned.apk
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias "$KA" \
            --ks-pass "pass:$KSP" --key-pass "pass:$KP" \
            --out app-release-signed.apk /tmp/aligned.apk
          "$APKSIGNER" verify app-release-signed.apk

      - name: 上传 Debug APK
        if: github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: YunX-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0

      - name: 上传 Release APK
        if: github.event.inputs.build_type != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: YunX-${{ steps.version.outputs.name }}-release
          path: app-release-signed.apk
          compression-level: 0

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: YunX v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app-release-signed.apk
